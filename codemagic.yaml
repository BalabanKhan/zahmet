workflows:
  zahmet-workflow:
    name: Zahmet Default Build
    environment:
      flutter: master
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Patch isar_flutter_libs namespace for Android
        script: |
          # Codemagic pub-cache patch
          ISAR_GRADLE=$(find $FLUTTER_ROOT/.pub-cache/hosted/pub.dev -path "*/isar_flutter_libs-*/android/build.gradle" | head -n 1)
          if [ -n "$ISAR_GRADLE" ]; then
            if ! grep -q "namespace" "$ISAR_GRADLE"; then
              sed -i.bak -e 's/android {/android {\n    namespace "dev.isar.isar_flutter_libs"/g' "$ISAR_GRADLE"
              echo "Patched $ISAR_GRADLE"
            fi
          fi
      - name: Set iOS deployment target to 13.0
        script: |
          sed -i.bak -e 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' ios/Runner.xcodeproj/project.pbxproj || true
      - name: Build Android AAB
        script: |
          flutter build appbundle --release
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa
